<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIT Ropar – 3D Campus Model</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="campus3d"></canvas>

    <!-- Header -->
    <div id="header">
        <div class="header-left">
            <span class="logo">🏛️</span>
            <div>
                <h1>IIT Ropar – 3D Campus Model</h1>
                <p class="subtitle">Indian Institute of Technology Ropar, Punjab</p>
            </div>
        </div>
        <div class="header-right">
            <button id="btnReset" class="hbtn">🏠 Reset</button>
            <button id="btnTop" class="hbtn">⬆️ Top View</button>
            <button id="btnLabels" class="hbtn active">🏷️ Labels</button>
            <button id="btnExitFullscreen" class="hbtn" style="display: none;">⛶ Exit Fullscreen</button>
        </div>
    </div>

    <!-- Sidebar toggle button -->
    <button id="btnSidebar" title="Toggle sidebar">🏗️</button>

    <!-- Side panel (hidden by default) -->
    <div id="sidePanel" class="collapsed">
        <div class="sp-head">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <h2 style="margin-bottom: 0;">🏗️ Campus Buildings</h2>
                <button id="btnCloseSidebar" class="close-sidebar-btn">✕</button>
            </div>
            <input type="text" id="searchBox" placeholder="Search buildings..." />
        </div>
        <div id="buildingList"></div>
    </div>

    <!-- Info popup -->
    <div id="infoPanel" class="hidden">
        <button id="closeInfo">✕</button>
        <h3 id="infoTitle"></h3>
        <p id="infoDesc"></p>
        <div id="infoTags"></div>
        <button id="btnDirections" class="directions-btn">🧭 Directions</button>
    </div>

    <!-- Navigation Panel -->
    <div id="navPanel" class="nav-panel hidden">
        <div class="nav-header">
            <span>🧭 Navigation</span>
            <button id="closeNav">✕</button>
        </div>
        <div class="nav-body">
            <div class="nav-field">
                <label>📍 From</label>
                <select id="navFrom">
                    <option value="__gps__">📍 My Current Location</option>
                </select>
            </div>
            <div class="nav-swap-row">
                <button id="btnSwapNav" title="Swap">⇅</button>
            </div>
            <div class="nav-field">
                <label>🎯 To</label>
                <select id="navTo"></select>
            </div>
            <button id="btnGetDirections" class="get-directions-btn">🧭 Get Directions</button>
        </div>
        <div id="navSteps" class="nav-steps hidden"></div>
    </div>

    <!-- Legend -->
    <div id="legend">
        <h4>LEGEND</h4>
        <div class="lg"><span style="background:#3b82f6"></span>Academic</div>
        <div class="lg"><span style="background:#f59e0b"></span>Hostel</div>
        <div class="lg"><span style="background:#10b981"></span>Sports</div>
        <div class="lg"><span style="background:#a855f7"></span>Admin</div>
        <div class="lg"><span style="background:#ef4444"></span>Landmark</div>
        <div class="lg"><span style="background:#06b6d4"></span>Facility</div>
        <div class="lg"><span style="background:#78716c"></span>Road</div>
    </div>

    <!-- GPS Location UI -->
    <button id="gps-button" class="gps-button" title="My Location">📍</button>
    <div id="gps-display">
        <div>LAT: <strong id="gps-lat">0.000000</strong></div>
        <div>LNG: <strong id="gps-lng">0.000000</strong></div>
    </div>

    <!-- Loading -->
    <div id="loader">
        <div class="ld-inner">
            <div class="spinner"></div>
            <h2>Building 3D Campus…</h2>
        </div>
    </div>

    <!-- Three.js from CDN -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
